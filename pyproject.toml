[project]
name = "lumen"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Furqan Ahmad Rupom", email = "furqanrupom978@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "bs4>=0.0.2",
    "langchain>=1.4.9",
    "langchain-anthropic>=1.7.10",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.7.6",
    "langchain-google-genai>=4.4.3",
    "langchain-openai>=1.7.4",
    "langchain-openapi>=0.1.1",
    "langgraph>=1.2.20",
    "pypdf>=7.0.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
lumen = "lumen:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
